[project]
name = "vlmserve"
version = "0.1.0"
description = "A small vision-language model server with a paged KV cache and continuous batching"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "eljandoubi_a", email = "abdelkarim.eljandoubi@lcl.fr" }
]
keywords = ["vlm", "llm", "inference", "serving", "paged-attention"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vlmserve = "vlmserve.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
    "types-psutil>=7.2.2.20260906",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",
    "PT",       # pytest style
    "PERF",
    "RUF",
    "S",        # bandit
    "T20",      # stray prints
]
ignore = [
    "N812",     # `F` for torch.nn.functional is the usual alias
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"benchmarks/**" = ["T20", "S311"]
"randomhf/**" = ["T20", "S106"]  # S106 reads unk_token as a password
"src/vlmserve/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["vlmserve", "benchmarks", "randomhf"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false  # calling an nn.Module is typed as Any
plugins = ["pydantic.mypy"]
files = ["src", "tests", "benchmarks", "randomhf"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# transformers is too loosely typed for --strict, what we take from it is Any
module = ["transformers", "transformers.*", "tokenizers", "tokenizers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 120
markers = [
    "slow: long running, or needs real checkpoints",
    "hub: needs network access to the Hugging Face hub",
]

[tool.coverage.run]
source = ["vlmserve"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
